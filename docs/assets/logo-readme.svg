<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-label="Arthas Workbench">
  <title>Arthas Workbench</title>
  <!--
    README logo derived from src/main/resources/icons/original/arthasWorkbenchDiagnosticWave_128x128.svg.
    Light: black strokes like the original motif. Dark: light gray matching plugin dark icons.
    Presentation attributes stay #000 if style is stripped. No brand blue.
  -->
  <style>
    :root { color-scheme: light dark; }
    .stroke { stroke: #000; }
    .fill { fill: #000; }
    @media (prefers-color-scheme: dark) {
      .stroke { stroke: #CED0D6; }
      .fill { fill: #CED0D6; }
    }
  </style>
