<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-label="Arthas Workbench">
  <title>Arthas Workbench</title>
  <!--
    README logo derived from src/main/resources/icons/original/arthasWorkbenchDiagnosticWave_128x128.svg.
    Brand blue stays visible on both GitHub light and dark canvases, including when
    GitHub appearance is set independently of the OS prefers-color-scheme.
    CSS only tints within that same mid-contrast family; presentation attributes
    remain #1677ff if style is stripped.
  -->
  <style>
    :root { color-scheme: light dark; }
    .pane { fill: #1677ff; fill-opacity: 0.12; stroke: #1677ff; }
    .stroke { stroke: #1677ff; }
    .fill { fill: #1677ff; }
    @media (prefers-color-scheme: light) {
      .pane { fill: #0a66d1; fill-opacity: 0.08; stroke: #0a66d1; }
      .stroke { stroke: #0a66d1; }
      .fill { fill: #0a66d1; }
    }
    @media (prefers-color-scheme: dark) {
      .pane { fill: #58a6ff; fill-opacity: 0.16; stroke: #58a6ff; }
      .stroke { stroke: #58a6ff; }
      .fill { fill: #58a6ff; }
    }
  </style>
  <rect class="pane" x="16" y="18" width="96" height="92" rx="15" fill="#1677ff" fill-opacity="0.12" stroke="#1677ff" stroke-width="7"/>
  <path class="stroke" d="M16 44H112" stroke="#1677ff" stroke-width="7" stroke-linecap="round"/>
  <circle class="fill" cx="33" cy="31" r="3.6" fill="#1677ff"/>
  <circle class="fill" cx="46" cy="31" r="3.6" fill="#1677ff"/>
  <circle class="fill" cx="59" cy="31" r="3.6" fill="#1677ff"/>
  <path class="stroke" d="M28 78H41L51 70L59 89L71 58L82 91L92 78H101" stroke="#1677ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
